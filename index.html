<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cumpleaños - Agrícola Huarmey</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --azul-frusan: #005691;
      --verde-frusan: #4CAF50;
    }
    .bg-frusan-azul { background-color: var(--azul-frusan); }
    .text-frusan-azul { color: var(--azul-frusan); }
    .border-frusan-azul { border-color: var(--azul-frusan); }
    .bg-frusan-verde { background-color: var(--verde-frusan); }
  </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen pb-12">

  <header class="bg-frusan-azul text-white shadow-md p-4 sticky top-0 z-50">
    <div class="container mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-white p-2 rounded-full w-12 h-12 flex items-center justify-center shadow">
          <i class="fa-solid fa-wheat-awn text-2xl text-emerald-600"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wide">Agrícola Huarmey</h1>
          <p class="text-xs text-blue-200">Fundo Frusan — Gestión de Cumpleaños</p>
        </div>
      </div>
      <div class="text-center sm:text-right">
        <p id="fecha-actual" class="text-sm font-semibold opacity-90"></p>
        <span class="inline-flex items-center bg-green-600 text-xs px-2.5 py-0.5 rounded-full font-medium mt-1 animate-pulse">
          <i class="fa-solid fa-sync fa-spin mr-1"></i> Sincronizado en Vivo
        </span>
      </div>
    </div>
  </header>

  <audio id="audio-alerta" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" preload="auto"></audio>

  <main class="container mx-auto px-4 mt-6">
    
    <section class="mb-8">
      <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-bell text-yellow-500"></i> Alertas y Recordatorios (Mañana y Hoy)
      </h2>
      <div id="contenedor-alertas" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="col-span-full bg-white p-6 rounded-xl text-center shadow border border-gray-100 text-gray-500">
          <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-frusan-azul"></i>
          <p>Cargando registros desde Google Sheets...</p>
        </div>
      </div>
    </section>

    <div class="bg-white p-4 rounded-xl shadow border border-gray-100 mb-6 flex flex-col sm:flex-row gap-4 items-center justify-between">
      <div class="relative w-full sm:w-72">
        <input type="text" id="buscador" onkeyup="filtrarContenido()" placeholder="Buscar colaborador o área..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        <div class="absolute left-3 top-2.5 text-gray-400">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
      </div>
      <div class="flex gap-2 text-xs font-semibold text-gray-600">
        <span class="bg-blue-50 text-blue-700 px-3 py-1.5 rounded-lg border border-blue-200">Total: <span id="contador-total">0</span></span>
      </div>
    </div>

    <section class="mb-10">
      <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-address-card text-frusan-azul"></i> Vista de Fichas Individuales
      </h2>
      <div id="grid-trabajadores" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        </div>
    </section>

    <section class="bg-white rounded-xl shadow border border-gray-100 overflow-hidden">
      <div class="p-4 bg-gray-50 border-b border-gray-100 flex justify-between items-center">
        <h2 class="font-bold text-gray-800 flex items-center gap-2">
          <i class="fa-solid fa-table text-frusan-azul"></i> Base de Datos Completa
        </h2>
      </div>
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200 text-left text-sm">
          <thead class="bg-gray-100 text-gray-700 uppercase text-xs font-semibold">
            <tr>
              <th class="px-6 py-3">Colaborador</th>
              <th class="px-6 py-3">Área</th>
              <th class="px-6 py-3">Puesto / Cargo</th>
              <th class="px-6 py-3">Cumpleaños</th>
              <th class="px-6 py-3 text-center">Acción</th>
            </tr>
          </thead>
          <tbody id="tabla-cuerpo" class="divide-y divide-gray-200 text-gray-600">
            </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    let listaPersonal = [];

    // Mostrar fecha de hoy en el header
    const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('fecha-actual').innerText = new Date().toLocaleDateString('es-ES', opcionesFecha);

    // Cargar datos desde Apps Script al iniciar
    window.onload = function() {
      google.script.run
        .withSuccessHandler(procesarDatos)
        .withFailureHandler(errorCarga)
        .obtenerDatosCumpleanios();
    };

    function errorCarga(err) {
      document.getElementById('contenedor-alertas').innerHTML = `
        <div class="col-span-full bg-red-50 border border-red-200 p-4 rounded-xl text-red-700 text-center">
          <i class="fa-solid fa-triangle-exclamation text-xl mb-1"></i>
          <p>Error de conexión con Google Sheets. Verifica los permisos de despliegue.</p>
        </div>`;
    }

    function procesarDatos(datos) {
      listaPersonal = datos;
      document.getElementById('contador-total').innerText = listaPersonal.length;
      renderizarComponentes(listaPersonal);
      verificarAlertasYCumpleanios(listaPersonal);
    }

    function renderizarComponentes(lista) {
      const grid = document.getElementById('grid-trabajadores');
      const tabla = document.getElementById('tabla-cuerpo');
      
      grid.innerHTML = '';
      tabla.innerHTML = '';

      if(lista.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-center py-6 text-gray-400">No se encontraron resultados</p>';
        return;
      }

      lista.forEach(persona => {
        // Formatear la fecha para visualización bonita (ej: 15 de Octubre)
        const partes = persona.cumpleanios.split('-');
        let fechaVisual = persona.cumpleanios;
        if(partes.length === 3) {
          const meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
          fechaVisual = `${partes[2]} de ${meses[parseInt(partes[1])-1]}`;
        }

        // Crear mensaje personalizado para WhatsApp
        const mensajeWa = encodeURIComponent(`¡Hola *${persona.colaborador}*! 👋 Te saludamos de parte de la familia de *Agrícola Huarmey - Fundo Frusan*. Queremos hacerte una cordial invitación para celebrar juntos tu cumpleaños. ¡Esperamos que pases un excelente día lleno de éxitos! 🎂🎉`);
        const linkWhatsapp = `https://api.whatsapp.com/send?phone=51${persona.celular}&text=${mensajeWa}`;

        // 1. Añadir al Grid / Tarjetas
        grid.innerHTML += `
          <div class="bg-white rounded-xl shadow border border-gray-100 p-5 flex flex-col justify-between hover:shadow-md transition card-item" data-nombre="${persona.colaborador}" data-area="${persona.area}">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="bg-blue-50 text-frusan-azul text-xs font-bold px-2.5 py-1 rounded-full">
                  <i class="fa-solid fa-cake-candles mr-1"></i> ${fechaVisual}
                </span>
                <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-400 text-xs">
                  <i class="fa-solid fa-user"></i>
                </div>
              </div>
              <h3 class="font-bold text-gray-800 text-sm line-clamp-2">${persona.colaborador}</h3>
              <p class="text-xs text-gray-500 mt-1"><i class="fa-solid fa-building text-gray-400 mr-1"></i>${persona.area}</p>
              <p class="text-xs text-gray-400"><i class="fa-solid fa-briefcase text-gray-300 mr-1"></i>${persona.puesto}</p>
            </div>
            <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-between">
              <span class="text-xs text-gray-500 font-mono">${persona.celular || 'Sin Celular'}</span>
              ${persona.celular ? `
                <a href="${linkWhatsapp}" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
                  <i class="fa-brands fa-whatsapp text-sm"></i> Invitar
                </a>
              ` : `<span class="text-xs text-gray-300 italic">No disponible</span>`}
            </div>
          </div>
        `;

        // 2. Añadir a la Tabla
        tabla.innerHTML += `
          <tr class="hover:bg-gray-50 transition">
            <td class="px-6 py-4 font-medium text-gray-900">${persona.colaborador}</td>
            <td class="px-6 py-4 text-xs">${persona.area}</td>
            <td class="px-6 py-4 text-xs">${persona.puesto}</td>
            <td class="px-6 py-4 text-xs font-semibold">${fechaVisual}</td>
            <td class="px-6 py-4 text-center">
              ${persona.celular ? `
                <a href="${linkWhatsapp}" target="_blank" class="inline-flex items-center gap-1 bg-green-100 text-green-700 hover:bg-green-200 px-2.5 py-1 rounded text-xs font-bold transition">
                  <i class="fa-brands fa-whatsapp"></i> Enviar WhatsApp
                </a>
              ` : `<span class="text-gray-400 text-xs italic">Sin Celular</span>`}
            </td>
          </tr>
        `;
      });
    }

    function verificarAlertasYCumpleanios(lista) {
      const contenedorAlertas = document.getElementById('contenedor-alertas');
      contenedorAlertas.innerHTML = '';

      const hoy = new Date();
      const mañana = new Date();
      mañana.setDate(hoy.getDate() + 1);

      let alertasEncontradas = 0;
      let activarSonido = false;

      lista.forEach(persona => {
        if(!persona.cumpleanios) return;
        
        const partes = persona.cumpleanios.split('-');
        if(partes.length !== 3) return;

        const mesCumple = parseInt(partes[1]) - 1;
        const diaCumple = parseInt(partes[2]);

        const mensajeWa = encodeURIComponent(`¡Hola *${persona.colaborador}*! 👋 Te saludamos de parte de la familia de *Agrícola Huarmey - Fundo Frusan*. Queremos hacerte una cordial invitación para celebrar juntos tu cumpleaños. ¡Esperamos que pases un excelente día lleno de éxitos! 🎂🎉`);
        const linkWhatsapp = `https://api.whatsapp.com/send?phone=51${persona.celular}&text=${mensajeWa}`;

        // Alerta de un día antes (Mañana)
        if(hoy.getMonth() === mesCumple && mañana.getDate() === diaCumple) {
          alertasEncontradas++;
          activarSonido = true;
          contenedorAlertas.innerHTML += `
            <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-xl shadow-sm flex flex-col justify-between gap-3">
              <div class="flex items-start gap-3">
                <div class="p-2 bg-amber-500 text-white rounded-lg"><i class="fa-solid fa-bell-ring animate-bounce"></i></div>
                <div>
                  <h4 class="font-bold text-amber-800 text-sm">¡MAÑANA CUMPLE AÑOS!</h4>
                  <p class="text-xs text-amber-900 font-semibold mt-0.5">${persona.colaborador}</p>
                  <p class="text-xs text-amber-700">${persona.area} — ${persona.puesto}</p>
                </div>
              </div>
              <div class="text-right">
                <a href="${linkWhatsapp}" target="_blank" class="inline-flex items-center gap-1 bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">
                  <i class="fa-brands fa-whatsapp"></i> Preparar Invitación
                </a>
              </div>
            </div>
          `;
        }

        // Alerta del mismo día (Hoy)
        if(hoy.getMonth() === mesCumple && hoy.getDate() === diaCumple) {
          alertasEncontradas++;
          contenedorAlertas.innerHTML += `
            <div class="bg-emerald-50 border-l-4 border-emerald-500 p-4 rounded-r-xl shadow-sm flex flex-col justify-between gap-3">
              <div class="flex items-start gap-3">
                <div class="p-2 bg-emerald-500 text-white rounded-lg"><i class="fa-solid fa-cake-candles fa-bounce"></i></div>
                <div>
                  <h4 class="font-bold text-emerald-800 text-sm">¡HOY ES SU CUMPLEÁÑOS! 🎉</h4>
                  <p class="text-xs text-emerald-900 font-semibold mt-0.5">${persona.colaborador}</p>
                  <p class="text-xs text-emerald-700">${persona.area} — ${persona.puesto}</p>
                </div>
              </div>
              <div class="text-right">
                <a href="${linkWhatsapp}" target="_blank" class="inline-flex items-center gap-1 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">
                  <i class="fa-brands fa-whatsapp"></i> Enviar Saludo Hoy
                </a>
              </div>
            </div>
          `;
        }
      });

      if(alertasEncontradas === 0) {
        contenedorAlertas.innerHTML = `
          <div class="col-span-full bg-gray-100 text-center py-4 rounded-xl text-xs text-gray-500">
            <i class="fa-solid fa-calendar-check mr-1"></i> No hay alertas de cumpleaños para hoy ni mañana.
          </div>`;
      }

      // Si hay alerta de "un día antes" (mañana), reproducir la alerta sonora
      if(activarSonido) {
        const audio = document.getElementById('audio-alerta');
        // El navegador exige interacción del usuario a veces para reproducir audio, intentamos reproducir de inmediato
        audio.play().catch(e => console.log("Audio en espera de interacción del usuario."));
      }
    }

    // Buscador instantáneo multitérmino
    function filtrarContenido() {
      const filtro = document.getElementById('buscador').value.toLowerCase();
      const tarjetas = document.getElementsByClassName('card-item');
      
      let contador = 0;
      for (let i = 0; i < tarjetas.length; i++) {
        const nombre = tarjetas[i].getAttribute('data-nombre').toLowerCase();
        const area = tarjetas[i].getAttribute('data-area').toLowerCase();
        
        if(nombre.includes(filtro) || area.includes(filtro)) {
          tarjetas[i].style.display = "";
          contador++;
        } else {
          tarjetas[i].style.display = "none";
        }
      }
      document.getElementById('contador-total').innerText = contador;
    }
  </script>
</body>
</html>
